syntax = "proto3";

package acme.payments.v1;

service Payments {
  rpc Charge(ChargeRequest) returns (ChargeResponse);
  rpc RefundStatus(RefundStatusRequest) returns (RefundStatusResponse);
}

message ChargeRequest {
  string order_id = 1;
  int64 amount_cents = 2;
  string currency = 3;
}

message ChargeResponse {
  string charge_id = 1;
  string status = 2;
}

message RefundStatusRequest {
  string refund_id = 1;
}

message RefundStatusResponse {
  string status = 1;
}
