name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/risco-actions/check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -e "packages/risco-core[sql,scan,dev]" -e packages/risco-cli
          mkdir -p .tools/bin
          curl -sSfL https://github.com/oasdiff/oasdiff/releases/download/v1.29.1/oasdiff_1.29.1_linux_amd64.tar.gz | tar xz -C .tools/bin oasdiff
      - env:
          RISCO_OASDIFF_BIN: ${{ github.workspace }}/.tools/bin/oasdiff
        run: pytest tests -q

  publish-python:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build packages/risco-core packages/risco-cli
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/risco-core/dist packages/risco-cli/dist

  build-sign-push-image:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        action: [check, index]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/risco-actions/${{ matrix.action }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: actions/${{ matrix.action }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          upload-artifact: true
      - name: Sign image (keyless cosign)
        if: matrix.action == 'check'
        uses: sigstore/cosign-installer@v3
      - name: cosign sign
        if: matrix.action == 'check'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/risco-actions/check@$(docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/risco-actions/check:${GITHUB_REF_NAME#v} --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "$IMAGE" || echo "signing skipped (no keyless in this environment)"
